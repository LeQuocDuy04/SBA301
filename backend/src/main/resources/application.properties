# Author: Lê Quốc Duy

spring.application.name=FUMiniHotelManagement

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FUMiniHotelManagement;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8080

# ===============================
# JWT CONFIGURATION
# ===============================
app.jwt.secret=MyFUMiniHotelSystemSecretKeyForJWT2026Security
app.jwt.expiration-ms=86400000
logging.level.org.springframework.security=TRACE
# ===============================
# STAFF ACCOUNT
# ===============================
app.staff.email=staff@fuminihotel.com
app.staff.password=Staff@123