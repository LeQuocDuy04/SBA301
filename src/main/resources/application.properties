security.jwt.secret-key=${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvckpXVFByb2plY3QxMjM0NTY=}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}
